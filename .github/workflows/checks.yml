name: Recipe checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tunnel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.9'
      - run: python3 -m unittest discover -s recipes/tunnel/tests -v
      - run: python3 -m py_compile recipes/tunnel/beam-tunnel recipes/tunnel/configure.py
      - run: bash -n recipes/tunnel/setup-relay.sh
